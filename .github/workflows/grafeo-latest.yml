# Runs the test suite against the newest grafeo on PyPI, pre-releases included,
# so an engine release that breaks this package shows up before users hit it.
#   pinned: the newest grafeo the requirement in pyproject.toml accepts
#   newest: the newest grafeo on PyPI, also past that requirement (next minor)
name: Grafeo latest

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: grafeo ${{ matrix.grafeo }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        grafeo: [pinned, newest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --no-sources --upgrade-package grafeo --prerelease allow
      - if: matrix.grafeo == 'newest'
        run: uv pip install --upgrade --prerelease allow grafeo
      - run: uv run --no-sync python -c "import grafeo; print(grafeo.__version__, grafeo.build_info())"
      - run: uv run --no-sync pytest -v
