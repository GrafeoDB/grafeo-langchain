[project]
name = "grafeo-langchain"
version = "0.2.1"
description = "LangChain graph store and vector store backed by GrafeoDB embedded graph database"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "GrafeoDB" }]
keywords = ["langchain", "graph-store", "graph-rag", "grafeo", "knowledge-graph", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
]

dependencies = [
    "grafeo>=0.5",
    "langchain-core>=1.2",
]

[project.optional-dependencies]
retriever = ["langchain-graph-retriever>=0.8"]

[project.urls]
Homepage = "https://github.com/GrafeoDB/grafeo-langchain"
Repository = "https://github.com/GrafeoDB/grafeo-langchain"
Issues = "https://github.com/GrafeoDB/grafeo-langchain/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafeo_langchain"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

# ── Ty ────────────────────────────────────────────────────────────────────────
[tool.ty.environment]
python-version = "3.12"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests requiring real embedding models and API keys"]
addopts = "-m 'not integration' --cov=grafeo_langchain --cov-report=term-missing"

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["grafeo_langchain"]
omit = ["*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ── UV ────────────────────────────────────────────────────────────────────────
[tool.uv]
dev-dependencies = [
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.15",
    "ty>=0.0.16",
    "langchain>=1.2",
    "langchain-graph-retriever>=0.8",
]

[tool.uv.sources]
grafeo = { path = "../grafeo/crates/bindings/python", editable = true }
